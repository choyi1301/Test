<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>골드 시세 계산기</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c0e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="골드계산기">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg: #0b0c0e;
  --panel: #16181c;
  --panel-2: #1c1f24;
  --gold: #c9a24a;
  --gold-bright: #e0bc63;
  --copper: #8b6f47;
  --text: #ece8e0;
  --muted: #8a8d92;
  --line: #2a2d32;
  --danger: #b2564a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg);}
body{
  color:var(--text);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  padding: 28px 16px 70px;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(201,162,74,0.07), transparent 40%),
    radial-gradient(circle at 90% 10%, rgba(139,111,71,0.06), transparent 35%);
}
.wrap{max-width:460px; margin:0 auto;}

/* Header */
header{margin-bottom:22px;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--gold); opacity:.85; margin-bottom:8px;
}
h1{
  font-family:'Noto Sans KR', sans-serif;
  font-weight:700; font-size:32px; line-height:1.2;
  letter-spacing:-0.01em;
}
h1 span{color:var(--gold-bright);}
.sub{color:var(--muted); font-size:13px; margin-top:6px; line-height:1.5;}

/* Card */
.card{
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.25);
}
.card-title{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); margin-bottom:16px;
  display:flex; align-items:center; gap:8px;
}
.card-title::before{
  content:''; width:6px; height:6px; border-radius:50%;
  background:var(--gold); display:inline-block;
}

/* Fields */
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
label{
  display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px;
}
label b{color:var(--text); font-weight:500;}
.input-row{
  display:flex; align-items:center;
  background:#101215; border:1px solid var(--line); border-radius:10px;
  padding:0 12px; transition:border-color .15s;
}
.input-row:focus-within{border-color:var(--gold);}
.input-row input{
  flex:1; background:transparent; border:none; outline:none;
  color:var(--text); font-family:'IBM Plex Mono', monospace;
  font-size:16px; padding:12px 8px 12px 0;
  min-width:0;
}
.input-row .unit{
  font-size:12px; color:var(--muted); white-space:nowrap;
  font-family:'IBM Plex Mono', monospace;
}
.date-row input{padding:12px 8px;}

.krw-hint{
  font-size:11.5px; color:var(--gold-bright); margin-top:6px;
  font-family:'IBM Plex Mono', monospace; min-height:14px;
}
.qty-row select{
  background:transparent; border:none; outline:none; border-left:1px solid var(--line);
  color:var(--text); font-family:'Noto Sans KR', sans-serif; font-size:13px;
  padding:12px 4px 12px 10px; cursor:pointer;
}
.qty-row select option{background:var(--panel); color:var(--text);}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

/* Button */
.btn{
  width:100%; border:none; border-radius:10px; padding:14px;
  font-family:'Inter', sans-serif; font-weight:600; font-size:14.5px;
  cursor:pointer; transition:transform .08s, opacity .15s;
  margin-top:18px;
}
.btn:active{transform:scale(0.98);}
.btn-primary{
  background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  color:#211a08;
}
.btn-ghost{
  background:transparent; border:1px solid var(--line); color:var(--text);
  margin-top:10px;
}
.btn-ghost:hover{border-color:var(--gold);}
.btn-fetch{
  width:100%; border:1px dashed var(--gold); border-radius:10px; padding:12px;
  background:rgba(201,162,74,0.06); color:var(--gold-bright);
  font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:600;
  cursor:pointer; margin-bottom:16px; letter-spacing:.02em;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-fetch:hover{background:rgba(201,162,74,0.1);}
.btn-fetch:disabled{opacity:.55; cursor:default;}
.btn-fetch .dot{
  width:6px; height:6px; border-radius:50%; background:var(--gold);
  animation:pulse 1.1s infinite ease-in-out;
}
@keyframes pulse{0%,100%{opacity:.3;} 50%{opacity:1;}}
.fetch-status{
  font-size:11.5px; color:var(--muted); text-align:center; margin:-8px 0 16px;
  font-family:'IBM Plex Mono', monospace; line-height:1.6;
}
.fetch-status.err{color:var(--danger);}
.caution{
  display:flex; align-items:flex-start; gap:8px;
  font-size:11.5px; color:var(--muted); line-height:1.6;
  margin:10px 0 16px; padding:10px 12px;
  background:rgba(178,86,74,0.08); border:1px solid rgba(178,86,74,0.35);
  border-radius:10px;
}
.caution svg{flex-shrink:0; margin-top:1px; width:15px; height:15px;}

/* Result */
#result-card{display:none;}
.result-main{
  text-align:center; padding:6px 0 18px;
  border-bottom:1px dashed var(--line);
  margin-bottom:16px;
}
.result-main .label{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.1em;
  color:var(--muted); text-transform:uppercase; margin-bottom:8px;
}
.result-main .value{
  font-family:'Noto Sans KR', sans-serif; font-weight:700;
  font-size:34px; color:var(--gold-bright); line-height:1.15;
}
.result-main .value small{font-size:18px; font-weight:600; color:var(--muted);}
.value-usd{
  font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--muted); margin-top:4px;
}
.v-usd{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:3px;}
.result-secondary{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;
}
.mini-stat{
  background:#101215; border:1px solid var(--line); border-radius:10px;
  padding:12px;
}
.mini-stat .l{font-size:11px; color:var(--muted); margin-bottom:6px;}
.mini-stat .v{font-family:'IBM Plex Mono', monospace; font-size:15px; color:var(--text);}
.formula{
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted);
  background:#101215; border:1px solid var(--line); border-radius:10px;
  padding:12px; line-height:1.7; word-break:break-all;
}
.formula b{color:var(--gold);}

/* History */
.history-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line);
  gap:10px;
}
.history-item:last-child{border-bottom:none;}
.history-item .hd{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); margin-bottom:4px;}
.history-item .hv{font-family:'Noto Sans KR', sans-serif; font-size:18px; font-weight:700; color:var(--text);}
.history-item .hv small{color:var(--muted); font-size:12px; font-family:'Inter',sans-serif; font-weight:400;}
.history-item .del{
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:16px; padding:6px;
}
.history-item .del:hover{color:var(--danger);}
.empty{
  text-align:center; color:var(--muted); font-size:13px; padding:20px 0;
}
.loading{
  text-align:center; color:var(--muted); font-size:12.5px; padding:10px 0;
  font-family:'IBM Plex Mono', monospace;
}
footer{
  text-align:center; color:var(--muted); font-size:11px; margin-top:24px;
  font-family:'IBM Plex Mono', monospace; opacity:.7;
}
.linkrow{
  display:flex; gap:8px; margin-bottom:16px;
}
.linkbtn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  text-decoration:none; color:var(--text);
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:11px 10px; font-size:12px; font-family:'Noto Sans KR', sans-serif; font-weight:500;
  transition:border-color .15s;
}
.linkbtn:hover{border-color:var(--gold); color:var(--gold-bright);}
.linkbtn svg{width:13px; height:13px; flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">LBMA GOLD FIX · USD/KRW</div>
    <h1>골드 시세 <span>계산기</span></h1>
  </header>

  <div class="linkrow">
    <a class="linkbtn" href="https://www.lbma.org.uk/prices-and-data/lbma-precious-metal-prices" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      LBMA 공식 고시가
    </a>
    <a class="linkbtn" id="hana-link" href="https://m.kebhana.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      하나은행 환율
    </a>
  </div>

  <!-- Input Card -->
  <div class="card">
    <div class="card-title">고시가 입력</div>

    <div class="field date-row">
      <label>기준일</label>
      <div class="input-row"><input type="date" id="in-date"></div>
    </div>

    <button class="btn-fetch" id="btn-fetch" style="margin-top:14px;">
      <span class="dot" id="fetch-dot" style="display:none;"></span>
      <span id="fetch-label">⟳ 다시 조회</span>
    </button>
    <div class="fetch-status" id="fetch-status" style="display:block;">실시간 금 시세·환율을 자동으로 조회하고 있어요…</div>
    <div class="caution">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>실시간 스팟 가격이며, 공식 LBMA AM/PM 확정 고시가와는 다를 수 있어요.</span>
    </div>

    <button class="btn-fetch" id="btn-fetch-official" style="border-color:var(--gold); background:rgba(201,162,74,0.1);">
      <span class="dot" id="fetch-official-dot" style="display:none;"></span>
      <span id="fetch-official-label">⛁ 공식 LBMA 고시가 가져오기 (10~20초, 베타)</span>
    </button>
    <div class="fetch-status" id="fetch-official-status"></div>

    <div class="field">
      <label><b>AM 고시가</b> (런던 10:30<span id="kst-am"></span>, 1 troy oz)</label>
      <div class="input-row">
        <input type="number" id="in-am" inputmode="decimal" placeholder="자동 조회 중…">
        <span class="unit">USD</span>
      </div>
      <div class="krw-hint" id="hint-am"></div>
    </div>

    <div class="field">
      <label><b>PM 고시가</b> (런던 15:00<span id="kst-pm"></span>, 1 troy oz)</label>
      <div class="input-row">
        <input type="number" id="in-pm" inputmode="decimal" placeholder="자동 조회 중…">
        <span class="unit">USD</span>
      </div>
      <div class="krw-hint" id="hint-pm"></div>
    </div>

    <div class="field">
      <label><b>환율</b> (하나은행 기준, 10:00 · USD→KRW)</label>
      <div class="input-row">
        <input type="number" id="in-rate" inputmode="decimal" placeholder="자동 조회 중…">
        <span class="unit">KRW</span>
      </div>
    </div>

    <div class="field">
      <label><b>계산할 무게</b></label>
      <div class="input-row qty-row">
        <input type="number" id="in-qty" inputmode="decimal" value="1" min="0" step="any">
        <select id="in-qty-unit">
          <option value="g">g (그램)</option>
          <option value="kg" selected>kg (킬로그램)</option>
          <option value="t">t (톤)</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" id="btn-calc">가격 계산하기</button>
  </div>

  <!-- Result Card -->
  <div class="card" id="result-card">
    <div class="card-title">계산 결과</div>

    <div class="result-main">
      <div class="label" id="result-main-label">1KG 금 가격 · PM 고시가 기준</div>
      <div class="value" id="out-pm-kg">-</div>
      <div class="value-usd" id="out-pm-usd"></div>
    </div>

    <div class="result-secondary">
      <div class="mini-stat">
        <div class="l" id="out-am-kg-label">AM 기준 1KG</div>
        <div class="v" id="out-am-kg">-</div>
        <div class="v-usd" id="out-am-usd"></div>
      </div>
      <div class="mini-stat">
        <div class="l">1 트로이온스 (PM)</div>
        <div class="v" id="out-oz-krw">-</div>
        <div class="v-usd" id="out-oz-usd"></div>
      </div>
    </div>

    <div class="formula" id="out-formula">-</div>

    <button class="btn btn-ghost" id="btn-save">기록에 저장</button>
  </div>

  <!-- History Card -->
  <div class="card">
    <div class="card-title">저장된 기록</div>
    <div id="history-list"><div class="loading">불러오는 중…</div></div>
  </div>

  <footer>1 KG = 32.150747 TROY OZ &nbsp;·&nbsp; 수동 입력 데이터</footer>
</div>

<script>
const OZ_PER_KG = 32.150747;
let lastResult = null;

const $ = (id) => document.getElementById(id);

// default date = today
$('in-date').value = new Date().toISOString().slice(0,10);

function fmtKRW(n){
  return Math.round(n).toLocaleString('ko-KR') + '원';
}
function fmtUSD(n){
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

async function fetchLive(isAuto) {
  const btn = $('btn-fetch');
  const dot = $('fetch-dot');
  const label = $('fetch-label');
  const status = $('fetch-status');

  btn.disabled = true;
  dot.style.display = 'inline-block';
  label.textContent = isAuto ? '실시간 시세 자동 조회 중…' : '조회 중…';
  status.className = 'fetch-status';
  status.style.display = 'block';
  status.textContent = isAuto
    ? '실시간 금 스팟 가격과 환율을 자동으로 불러오고 있어요…'
    : '';

  try {
    const [goldRes, fxRes] = await Promise.all([
      fetch('https://api.gold-api.com/price/XAU', { signal: AbortSignal.timeout(15000) }),
      fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW', { signal: AbortSignal.timeout(15000) })
    ]);

    if (!goldRes.ok) throw new Error('금 시세 조회 실패 (' + goldRes.status + ')');
    if (!fxRes.ok) throw new Error('환율 조회 실패 (' + fxRes.status + ')');

    const goldData = await goldRes.json();
    const fxData = await fxRes.json();

    const price = goldData.price;
    const rate = fxData.rates && fxData.rates.KRW;
    if (typeof price !== 'number' || typeof rate !== 'number') throw new Error('응답 형식 오류');

    $('in-date').value = new Date().toISOString().slice(0,10);
    $('in-am').value = price.toFixed(2);
    $('in-pm').value = price.toFixed(2);
    $('in-rate').value = rate.toFixed(2);
    if (typeof updateKrwHints === 'function') updateKrwHints();

    status.style.display = 'none';
  } catch (e) {
    console.error(e);
    status.className = 'fetch-status err';
    status.style.display = 'block';
    status.textContent = e.name === 'TimeoutError' || e.name === 'AbortError'
      ? '조회가 15초 안에 끝나지 않았어요. 값을 직접 입력해 주세요.'
      : '자동 조회에 실패했어요 (' + e.message + '). 값을 직접 입력해 주세요.';
    const examples = { 'in-am': '예: 4090.57', 'in-pm': '예: 4090.57', 'in-rate': '예: 1459.29' };
    Object.entries(examples).forEach(([id, ph]) => { $(id).placeholder = ph; });
  } finally {
    btn.disabled = false;
    dot.style.display = 'none';
    label.textContent = '⟳ 다시 조회';
  }
}

$('btn-fetch').addEventListener('click', () => fetchLive(false));

const OFFICIAL_LBMA_API = 'https://gold-calculator-eight-liard.vercel.app/api/lbma-price';

$('btn-fetch-official').addEventListener('click', async () => {
  const btn = $('btn-fetch-official');
  const dot = $('fetch-official-dot');
  const label = $('fetch-official-label');
  const status = $('fetch-official-status');

  btn.disabled = true;
  dot.style.display = 'inline-block';
  label.textContent = '공식 고시가 불러오는 중… (최대 20초)';
  status.className = 'fetch-status';
  status.style.display = 'block';
  status.textContent = '';

  try {
    const res = await fetch(OFFICIAL_LBMA_API, { signal: AbortSignal.timeout(30000) });
    if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || '값을 가져오지 못했어요.');

    if (typeof data.am === 'number') $('in-am').value = data.am;
    if (typeof data.pm === 'number') $('in-pm').value = data.pm;
    if (data.date) {
      // date comes back as "DD/MM" from the LBMA page; convert to this year's YYYY-MM-DD
      const m = data.date.match(/^(\d{2})\/(\d{2})$/);
      if (m) {
        const yyyy = new Date().getFullYear();
        $('in-date').value = `${yyyy}-${m[2]}-${m[1]}`;
      }
    }

    status.className = 'fetch-status';
    status.textContent = '✓ 공식 LBMA 고시가로 채웠어요' + (data.note ? ' · ' + data.note : '') + '. 환율은 직접 확인해서 넣어주세요.';
    if (typeof updateKrwHints === 'function') updateKrwHints();
  } catch (e) {
    console.error(e);
    status.className = 'fetch-status err';
    status.textContent = e.name === 'TimeoutError' || e.name === 'AbortError'
      ? '20초 안에 응답이 없어 중단했어요. 잠시 후 다시 시도해 주세요.'
      : '공식 고시가를 가져오지 못했어요 (' + e.message + ').';
  } finally {
    btn.disabled = false;
    dot.style.display = 'none';
    label.textContent = '⛁ 공식 LBMA 고시가 가져오기 (10~20초, 베타)';
  }
});


const UNIT_TO_KG = { g: 0.001, kg: 1, t: 1000 };
const UNIT_LABEL = { g: 'g', kg: 'KG', t: 't' };

$('btn-calc').addEventListener('click', () => {
  const am = parseFloat($('in-am').value);
  const pm = parseFloat($('in-pm').value);
  const rate = parseFloat($('in-rate').value);
  const date = $('in-date').value;
  let qty = parseFloat($('in-qty').value);
  if (isNaN(qty) || qty <= 0) qty = 1;
  const unit = $('in-qty-unit').value;
  const qtyKg = qty * UNIT_TO_KG[unit];

  if (isNaN(rate) || (isNaN(am) && isNaN(pm))) {
    alert('환율과 AM 또는 PM 고시가 중 최소 하나는 입력해 주세요.');
    return;
  }

  const pmPerKg = !isNaN(pm) ? pm * rate * OZ_PER_KG : null;
  const amPerKg = !isNaN(am) ? am * rate * OZ_PER_KG : null;
  const pmOzKrw = !isNaN(pm) ? pm * rate : null;
  const pmTotal = pmPerKg !== null ? pmPerKg * qtyKg : null;
  const amTotal = amPerKg !== null ? amPerKg * qtyKg : null;

  const pmTotalUsd = !isNaN(pm) ? pm * OZ_PER_KG * qtyKg : null;
  const amTotalUsd = !isNaN(am) ? am * OZ_PER_KG * qtyKg : null;
  const pmOzUsd = !isNaN(pm) ? pm : null;

  const qtyLabel = (qty === 1) ? ('1' + UNIT_LABEL[unit]) : (qty.toLocaleString('ko-KR', {maximumFractionDigits:4}) + UNIT_LABEL[unit]);
  $('result-main-label').textContent = qtyLabel + ' 금 가격 · PM 고시가 기준';
  $('out-pm-kg').innerHTML = pmTotal !== null ? fmtKRW(pmTotal) : '<small>미입력</small>';
  $('out-pm-usd').textContent = pmTotalUsd !== null ? fmtUSD(pmTotalUsd) : '';
  $('out-am-kg-label').textContent = 'AM 기준 ' + qtyLabel;
  $('out-am-kg').textContent = amTotal !== null ? fmtKRW(amTotal) : '미입력';
  $('out-am-usd').textContent = amTotalUsd !== null ? fmtUSD(amTotalUsd) : '';
  $('out-oz-krw').textContent = pmOzKrw !== null ? fmtKRW(pmOzKrw) : '미입력';
  $('out-oz-usd').textContent = pmOzUsd !== null ? fmtUSD(pmOzUsd) : '';

  const primaryPrice = pm || am;
  const primaryTotal = pmTotal !== null ? pmTotal : amTotal;
  $('out-formula').innerHTML =
    `32.150747 oz × <b>${rate.toLocaleString('en-US')}</b>원 × <b>${primaryPrice.toLocaleString('en-US')}</b>USD/oz × <b>${qtyKg}</b>kg<br>= <b>${fmtKRW(primaryTotal)}</b>`;

  $('result-card').style.display = 'block';
  $('result-card').scrollIntoView({behavior:'smooth', block:'nearest'});

  lastResult = {date, am: isNaN(am)?null:am, pm: isNaN(pm)?null:pm, rate, qty, unit, pmKg: pmTotal, amKg: amTotal};
});

function updateKrwHints(){
  const rate = parseFloat($('in-rate').value);
  const am = parseFloat($('in-am').value);
  const pm = parseFloat($('in-pm').value);
  $('hint-am').textContent = (!isNaN(rate) && !isNaN(am)) ? `≈ ${fmtKRW(am * rate)} / oz` : '';
  $('hint-pm').textContent = (!isNaN(rate) && !isNaN(pm)) ? `≈ ${fmtKRW(pm * rate)} / oz` : '';
}
['in-am','in-pm','in-rate'].forEach(id => $(id).addEventListener('input', updateKrwHints));

const hasClaudeStorage = (typeof window.storage !== 'undefined');

async function storageSet(key, value) {
  if (hasClaudeStorage) return window.storage.set(key, value, false);
  localStorage.setItem(key, value);
  return { key, value };
}
async function storageGet(key) {
  if (hasClaudeStorage) return window.storage.get(key, false);
  const value = localStorage.getItem(key);
  if (value === null) throw new Error('키를 찾을 수 없습니다: ' + key);
  return { key, value };
}
async function storageList(prefix) {
  if (hasClaudeStorage) return window.storage.list(prefix, false);
  const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix));
  return { keys };
}
async function storageDelete(key) {
  if (hasClaudeStorage) return window.storage.delete(key, false);
  localStorage.removeItem(key);
  return { key, deleted: true };
}

$('btn-save').addEventListener('click', async () => {
  if (!lastResult) return;
  const key = 'entry:' + Date.now();
  try {
    const res = await storageSet(key, JSON.stringify(lastResult));
    if (!res) { alert('저장에 실패했습니다.'); return; }
    await loadHistory();
  } catch (e) {
    console.error(e);
    alert('저장 중 오류가 발생했습니다.');
  }
});

async function loadHistory(){
  const listEl = $('history-list');
  listEl.innerHTML = '<div class="loading">불러오는 중…</div>';
  try {
    const listRes = await storageList('entry:');
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    if (keys.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 저장된 기록이 없어요.</div>';
      return;
    }
    const entries = [];
    for (const k of keys) {
      try {
        const r = await storageGet(k);
        if (r && r.value) entries.push({key:k, data: JSON.parse(r.value)});
      } catch(e) { /* skip missing */ }
    }
    entries.sort((a,b) => b.key.localeCompare(a.key));

    listEl.innerHTML = '';
    entries.forEach(({key, data}) => {
      const div = document.createElement('div');
      div.className = 'history-item';
      const mainKg = data.pmKg ?? data.amKg;
      const unitLabel = { g:'g', kg:'kg', t:'t' }[data.unit] || 'kg';
      const qtyLabel = (!data.qty || data.qty === 1) ? ('1' + unitLabel) : (data.qty + unitLabel);
      div.innerHTML = `
        <div>
          <div class="hd">${data.date} · 환율 ${data.rate.toLocaleString('en-US')}</div>
          <div class="hv">${mainKg ? fmtKRW(mainKg) : '-'} <small>/ ${qtyLabel}</small></div>
        </div>
        <button class="del" title="삭제">✕</button>
      `;
      div.querySelector('.del').addEventListener('click', async () => {
        try {
          await storageDelete(key);
          await loadHistory();
        } catch(e) { console.error(e); }
      });
      listEl.appendChild(div);
    });
  } catch (e) {
    console.error(e);
    listEl.innerHTML = '<div class="empty">기록을 불러오지 못했습니다.</div>';
  }
}

function updateKstLabels(){
  // Determine current London UTC offset (handles BST/GMT automatically)
  const now = new Date();
  const asUTC = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
  const asLondon = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/London' }));
  const londonOffsetHours = Math.round((asLondon - asUTC) / 3600000); // 0 (GMT) or 1 (BST)
  const kstOffsetFromLondon = 9 - londonOffsetHours; // KST is fixed UTC+9

  function londonToKstLabel(hour, minute){
    let totalMin = hour * 60 + minute + kstOffsetFromLondon * 60;
    let dayShift = 0;
    while (totalMin >= 24 * 60) { totalMin -= 24 * 60; dayShift++; }
    while (totalMin < 0) { totalMin += 24 * 60; dayShift--; }
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    const hh = String(h).padStart(2,'0'), mm = String(m).padStart(2,'0');
    return ` · 한국 ${hh}:${mm}${dayShift > 0 ? ' (다음날)' : dayShift < 0 ? ' (전날)' : ''}`;
  }

  $('kst-am').textContent = londonToKstLabel(10, 30);
  $('kst-pm').textContent = londonToKstLabel(15, 0);
}

  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

updateKstLabels();

}

loadHistory();
fetchLive(true);
